# Ponto de venda. Decisões e limites: docs/adr/0008-ponto-de-venda.md
#
# Depende de `comercial` porque vende os produtos dele e baixa o estoque dele, e de
# `clientes` porque a venda pode apontar para quem comprou, e de `financeiro` porque o
# pagamento pode dizer em qual conta o dinheiro caiu — ver
# docs/adr/0007-dependencia-entre-modulos.md. Instalar o PDV traz os dois junto; o custo
# disso está assumido na atualização de 29/10/2026 da docs/adr/0008-ponto-de-venda.md.

[module]
name = "pdv"
label = "Ponto de venda"
version = "0.1.0"
package = "decko_modules.pdv"
depends = ["core", "comercial", "clientes", "financeiro"]
required = false
category = "Operação"
icon = "register"
accent = "teal"
summary = "Venda de balcão: bipa o produto, recebe em dinheiro, cartão ou pix e baixa o estoque."

[migrations]
branch_label = "pdv"

[permissions]
provides = [
  "pdv.venda.read",
  "pdv.venda.write",
  "pdv.venda.finalizar",
  "pdv.venda.cancelar",
  # Devolver dinheiro nao e a mesma autoridade que vender: venda finalizada nao e
  # cancelada, ela ganha uma devolucao, e quem pode fazer isso a loja decide.
  "pdv.venda.devolver",
  "pdv.venda.identificar",
  "pdv.caixa.abrir",
  # Separada de abrir pelo mesmo motivo que `pdv.venda.finalizar` e de `pdv.venda.write`:
  # a loja decide se quem opera o caixa tambem o fecha.
  "pdv.caixa.fechar",
  # O relatório do dia inteiro é do dono, e não de quem opera: ele soma todos os
  # operadores e mostra o esperado em espécie. Exigir só `pdv.venda.read` — que o
  # operador precisa ter para vender — entregava a ele o número antes da contagem, que é
  # o mesmo vazamento que a conferência cega existe para impedir.
  "pdv.caixa.conferir",
]

# Papéis sugeridos a quem contrata o PDV. Criados na empresa que não os tem, e nunca mais
# tocados: o que o operador pode fazer é decisão da loja. Ver
# docs/adr/0020-operador-supervisor-e-papeis.md, decisões 2 e 3.
#
# Só concedem permissão de módulo que o PDV declara em `depends` — o operador precisa ler
# produto para vender, e `comercial` vem junto com o PDV.

[[roles]]
name = "Operador de caixa"
description = "Vende no balcão e abre o próprio caixa. Não cancela, não devolve e não fecha."
grants = [
  "pdv.venda.read",
  "pdv.venda.write",
  "pdv.venda.finalizar",
  "pdv.caixa.abrir",
  "comercial.produto.read",
  "comercial.estoque.read",
  "comercial.unidade.read",
  "comercial.lote.read",
]

[[roles]]
name = "Supervisor de caixa"
description = "Tudo do operador, mais o que o operador precisa de autorização para fazer."
grants = [
  "pdv.venda.read",
  "pdv.venda.write",
  "pdv.venda.finalizar",
  "pdv.venda.cancelar",
  "pdv.venda.devolver",
  "pdv.venda.identificar",
  "pdv.caixa.abrir",
  "pdv.caixa.fechar",
  "pdv.caixa.conferir",
  "comercial.produto.read",
  "comercial.estoque.read",
  "comercial.unidade.read",
  "comercial.lote.read",
  "clientes.cliente.read",
]

[menu]
label = "Ponto de venda"
order = 50
