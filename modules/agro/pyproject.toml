[project]
name = "decko-module-agro"
version = "0.1.0"
description = "Decko agro module: agricultural spraying operations and MAPA reporting"
requires-python = ">=3.13"
dependencies = [
    # O KML do croqui vem de fora. O parser padrão aceita entidade externa.
    "defusedxml>=0.7",
    "decko-api",
    "decko-module-core",
    "httpx>=0.28",
    "reportlab>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decko_modules"]

[tool.uv.sources]
decko-api = { workspace = true }
decko-module-core = { workspace = true }
