[project]
name = "decko-module-compras"
version = "0.1.0"
description = "Decko purchasing: import the supplier invoice and receive stock"
requires-python = ">=3.13"
dependencies = [
    "decko-api",
    "decko-module-core",
    "decko-module-comercial",
    # O XML vem de fora, por e-mail. O parser padrão aceita entidade externa, e um
    # arquivo preparado lê arquivo do servidor ou trava o processo.
    "defusedxml>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decko_modules"]

[tool.uv.sources]
decko-api = { workspace = true }
decko-module-core = { workspace = true }
decko-module-comercial = { workspace = true }
