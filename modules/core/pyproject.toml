[project]
name = "decko-module-core"
version = "0.1.0"
description = "Decko core module: tenants, users, authentication, RBAC and audit"
requires-python = ">=3.13"
dependencies = [
    "decko-api",
    "pyjwt>=2.10",
    "argon2-cffi>=25.1",
    "python-multipart>=0.0.20",
    "email-validator>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decko_modules"]

[tool.uv.sources]
decko-api = { workspace = true }
