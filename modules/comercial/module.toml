# Base comercial: o que ferragista, supermercado, lanchonete e distribuidora usam igual.
# Decisões em docs/adr/0006-base-comercial.md
#
# Este módulo não depende de nenhuma vertical. As verticais é que dependem dele.

[module]
name = "comercial"
label = "Comercial"
version = "0.1.0"
package = "decko_modules.comercial"
depends = ["core"]
required = false

[migrations]
branch_label = "comercial"

[permissions]
provides = [
  "comercial.unidade.read",
  "comercial.unidade.write",
  "comercial.categoria.read",
  "comercial.categoria.write",
  "comercial.produto.read",
  "comercial.produto.write",
  "comercial.lote.read",
  "comercial.lote.write",
  "comercial.estoque.read",
  "comercial.estoque.movimentar",
]

[menu]
label = "Produtos e estoque"
icon = "box"
order = 100
