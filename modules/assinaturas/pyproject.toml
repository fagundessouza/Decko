[project]
name = "decko-module-assinaturas"
version = "0.1.0"
description = "Decko recurring subscriptions"
requires-python = ">=3.13"
dependencies = [
    "decko-api",
    "decko-module-core",
    "decko-module-clientes",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decko_modules"]

[tool.uv.sources]
decko-api = { workspace = true }
decko-module-core = { workspace = true }
decko-module-clientes = { workspace = true }
