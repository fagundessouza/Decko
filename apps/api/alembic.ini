[alembic]
script_location = %(here)s/src/decko/migrations

# As migrações vivem dentro de cada módulo, para o módulo continuar autocontido.
# Ao criar um módulo novo, acrescente o caminho dele aqui.
version_locations =
    %(here)s/../../modules/core/migrations/versions
    %(here)s/../../modules/agro/migrations/versions
    %(here)s/../../modules/comercial/migrations/versions
    %(here)s/../../modules/pdv/migrations/versions
    %(here)s/../../modules/compras/migrations/versions
    %(here)s/../../modules/clientes/migrations/versions
    %(here)s/../../modules/financeiro/migrations/versions
version_path_separator = newline

# A URL real vem de DECKO_MIGRATION_DATABASE_URL (ver env.py). Migração roda como dono do
# schema; a aplicação roda com outro papel, sujeito a RLS.
sqlalchemy.url =

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
