<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Decko">
  <!-- A marca do Decko: o D, os pixels que saem dele e a folha.
       Provisória até o arquivo oficial ser exportado do material de identidade — quando
       ele existir, é só substituir este arquivo, que o nome e o uso continuam os mesmos. -->
  <defs>
    <linearGradient id="corpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="folha" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#15803D"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <!-- O D, com o miolo recortado pela regra par-ímpar. -->
  <path
    fill="url(#corpo)"
    fill-rule="evenodd"
    d="M15 7h12a17 17 0 0 1 0 34H15a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Zm7 9v16h5a8 8 0 0 0 0-16h-5Z"
  />

  <!-- Os pixels, subindo pela diagonal. Ficam dentro da área do desenho: antes eles saíam
       para fora da caixa e encostavam na borda da página. -->
  <rect x="7.5" y="4" width="6.5" height="6.5" rx="1.6" fill="#22C55E"/>
  <rect x="1.5" y="11.5" width="5" height="5" rx="1.3" fill="#16A34A"/>
  <rect x="5" y="19.5" width="3.5" height="3.5" rx="1" fill="#22C55E" opacity=".7"/>

  <!-- A folha, saindo da base do D. Duas metades com uma nervura entre elas, encaixadas
       na curva da letra em vez de escapando para fora dela. -->
  <path fill="url(#folha)" d="M15 40.5c0-7.3 4.9-12.6 12.2-13.1-.1 7.3-5 12.6-12.2 13.1Z"/>
  <path fill="#16A34A" opacity=".9" d="M27.2 27.4c-4.4-2.9-9.7-2-13 2.3 4.4 2.5 9.3 1.6 13-2.3Z"/>
</svg>
